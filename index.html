<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a0f12">
  <title>Nossa História</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="cena" id="cena">

    <!-- ============ O LIVRO ============ -->
    <div class="livro" id="livro">

      <!-- Miolo: páginas geradas pelo JS (js/livro.js) -->
      <div class="paginas" id="paginas" data-container="paginas"></div>

      <!-- Capa (fica por cima do miolo até abrir) -->
      <div class="capa" id="capa">
        <div class="capa-frente">
          <div class="capa-moldura">
            <span class="capa-ornamento">❦</span>
            <h1 class="capa-titulo" data-field="titulo">Nossa História</h1>
            <p class="capa-autores" data-field="autores">Valbison &amp; Jiclea</p>
            <span class="capa-linha"></span>
            <p class="capa-desde" data-field="desde">desde 12 · 08 · 2025</p>
          </div>

          <!-- Correia com cadeado -->
          <div class="correia" id="correia">
            <div class="cadeado" id="cadeado">
              <div class="cadeado-arco"></div>
              <div class="cadeado-corpo">
                <div class="fechadura">
                  <div class="chave" id="chave">
                    <span class="chave-cabo"></span>
                    <span class="chave-haste"></span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="capa-verso"></div>
      </div>
    </div>

    <div class="controles">
      <!-- Botão de abrir (só aparece com o livro fechado) -->
      <button class="btn-chave" id="btnAbrir" type="button">
        <span class="btn-chave-icone" aria-hidden="true">🗝️</span>
        Clique aqui para girar a chave
      </button>

      <!-- Navegação (aparece com o livro aberto) -->
      <nav class="navegacao" id="navegacao" aria-label="Navegação do livro">
        <button class="nav-btn" id="btnAnterior" type="button" aria-label="Página anterior">‹</button>
        <span class="nav-contador" id="contadorPaginas">1 / 1</span>
        <button class="nav-btn" id="btnProxima" type="button" aria-label="Próxima página">›</button>
      </nav>
    </div>

    <button class="btn-som" id="btnSom" type="button" aria-label="Ligar ou desligar a música">♪</button>
  </main>

  <!-- Janela do vídeo -->
  <div class="video-janela" id="videoJanela" aria-hidden="true">
    <div class="video-caixa">
      <button class="video-fechar" id="videoFechar" type="button" aria-label="Fechar vídeo">×</button>
      <div class="video-moldura" id="videoMoldura"></div>
    </div>
  </div>

  <script src="js/dados.js"></script>
  <script src="js/musica.js"></script>
  <script src="js/livro.js"></script>
</body>
</html>
